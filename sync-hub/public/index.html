<h1>EcoRuta Sync Hub</h1>
<p>Servicio aparte de sincronización. Los sistemas se conectan con <code>X-System-Key</code>.</p>
<ul>
<li><code>GET /hub/health</code> (público)</li>
<li><code>POST /hub/push</code> + <code>GET /hub/pull?since=&amp;limit=&amp;entity=</code> (con clave)</li>
<li><code>GET /hub/stats</code> (con clave)</li>
</ul>
<p>Ver README para integrar un sistema.</p>
